# Cloudflare Worker settings for www.sardargems.com
name = "sardargemspvt"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true          # keep the variables and secrets set in the Cloudflare dashboard

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/10 * * * *"]
